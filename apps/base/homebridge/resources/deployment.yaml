---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: homebridge
    app.kubernetes.io/name: homebridge
  name: homebridge
  namespace: homebridge
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: homebridge
      app.kubernetes.io/name: homebridge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: homebridge
        app.kubernetes.io/name: homebridge
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            # Use host Avahi (via D-Bus) instead of a second mDNS stack.
            - name: ENABLE_AVAHI
              value: "0"
            - name: TZ
              value: Europe/London
          image: ghcr.io/homebridge/homebridge:2026-11-02
          name: homebridge
          ports:
            - containerPort: 8581
              name: http
              protocol: TCP
          # Plugin install (npm) runs before the UI listens.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources: {}
          volumeMounts:
            - mountPath: /homebridge
              name: data
            # Sockets only: setup.sh rm/chowns files in these directories.
            - mountPath: /run/avahi-daemon/socket
              name: avahi-socket
            - mountPath: /run/dbus/system_bus_socket
              name: dbus-socket
      # HomeKit discovery needs mDNS on the LAN.
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      # Seed GitOps-managed files into the data volume on every start.
      # The UI may edit them at runtime; changes revert on restart.
      initContainers:
        - command:
            - sh
            - -c
            - |
              cp /config/config.json /homebridge/
              cp /files/package.json /files/startup.sh /homebridge/
              chmod 0755 /homebridge/startup.sh
          image: ghcr.io/homebridge/homebridge:2026-11-02
          name: seed
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
            - mountPath: /files
              name: files
              readOnly: true
            - mountPath: /homebridge
              name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - hostPath:
            path: /run/avahi-daemon/socket
            type: Socket
          name: avahi-socket
        - hostPath:
            path: /run/dbus/system_bus_socket
            type: Socket
          name: dbus-socket
        - name: config
          secret:
            secretName: homebridge-config
        - configMap:
            name: homebridge-files
          name: files
        - name: data
          persistentVolumeClaim:
            claimName: homebridge-data
